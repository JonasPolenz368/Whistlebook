<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B1F3A">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta property="og:image" content="icon-512.png">
<title>Whistlebook — Rechtliches · Legal</title>
<style>
  :root {
    --navy: #0B1F3A; --navy-2: #16335C; --pitch: #1F7A3D; --pitch-light: #4CC274;
    --bg: #EEF1F6; --card: #FFFFFF; --ink: #111827; --muted: #5B6475; --line: #E2E6EE;
    --link: #1F7A3D; --chip: rgba(255,255,255,.12); --chip-ink: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #060E1C; --card: #0F1B30; --ink: #E8ECF3; --muted: #9AA5B8; --line: #1E2C45; --link: #4CC274; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; line-height: 1.65; color: var(--ink); background: var(--bg); }
  .hero { background: radial-gradient(120% 140% at 0% 0%, var(--navy-2) 0%, var(--navy) 55%, #061226 100%); color: #fff; }
  .hero-inner { max-width: 820px; margin: 0 auto; padding: 22px 20px 26px; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
  .brand img { width: 44px; height: 44px; border-radius: 11px; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .brand b { display: block; font-size: 18px; letter-spacing: -0.01em; }
  .brand small { display: block; font-size: 13px; color: rgba(255,255,255,.7); }
  .langbar { flex-wrap: wrap; gap: 8px; margin-top: 20px; font-size: 14px; }
  .langbar a { color: var(--chip-ink); text-decoration: none; padding: 6px 13px; border-radius: 999px; background: var(--chip); }
  .langbar a.active { background: var(--pitch-light); color: #062012; font-weight: 600; }
  main { max-width: 820px; margin: -10px auto 0; padding: 0 16px 64px; }
  section[data-lang] { background: var(--card); border-radius: 20px; padding: 28px 26px 30px; box-shadow: 0 1px 2px rgba(10,20,40,.06), 0 10px 30px rgba(10,20,40,.06); }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.02em; }
  h2 { font-size: 19px; margin: 34px 0 6px; padding-top: 18px; border-top: 1px solid var(--line); }
  h3 { font-size: 16px; margin: 22px 0 4px; }
  p, li, address { font-size: 16px; }
  .updated { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .summary { background: linear-gradient(0deg, rgba(31,122,61,.08), rgba(31,122,61,.08)), var(--card); border-left: 4px solid var(--pitch); border-radius: 12px; padding: 14px 18px; }
  a { color: var(--link); }
  address { font-style: normal; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; display: block; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; background: rgba(11,31,58,.04); }
  footer { max-width: 820px; margin: 0 auto; padding: 0 20px 48px; font-size: 14px; color: var(--muted); }
  footer a { margin-right: 16px; }
  footer .copy { display: block; margin-top: 10px; }
  @media (max-width: 520px) { section[data-lang] { padding: 22px 18px 24px; border-radius: 16px; } h1 { font-size: 26px; } }
  /* Without JavaScript all language versions stay visible (accessibility). */
  html.js section[data-lang] { display: none; }
  html.js section[data-lang].active { display: block; }
  html.js .langbar { display: flex; }
  html:not(.js) .langbar { display: none; }
  html:not(.js) section[data-lang] { margin-bottom: 16px; }

  body { min-height: 100vh; background: radial-gradient(120% 90% at 50% 0%, var(--navy-2) 0%, var(--navy) 50%, #050D1A 100%); color: #fff; text-align: center; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 72px 20px 56px; }
  .wrap > img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
  h1 { font-size: 32px; margin: 22px 0 4px; }
  p.sub { color: rgba(255,255,255,.72); font-size: 15px; margin: 0; }
  ul { list-style: none; padding: 0; margin: 32px 0 0; }
  li { margin: 12px 0; }
  li a { display: block; padding: 14px 20px; border-radius: 16px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); color: #fff; text-decoration: none; font-weight: 600; }
  li a:hover { background: rgba(76,194,116,.18); border-color: rgba(76,194,116,.5); }
  .also { display: block; font-size: 12px; font-weight: 500; color: rgba(255,255,255,.6); }
  p.langs { margin-top: 28px; font-size: 13px; color: rgba(255,255,255,.55); }
</style>
</head>
<body>
  <div class="wrap">
    <img src="icon-512.png" alt="Whistlebook">
    <h1>Whistlebook</h1>
    <p class="sub">Die App für Fußball-Schiedsrichter · The app for football referees</p>
    <ul>
    <li><a href="support.html">Hilfe &amp; Kontakt<span class="also">Help &amp; contact</span></a></li>
    <li><a href="impressum.html">Impressum<span class="also">Legal notice</span></a></li>
    <li><a href="terms.html">Nutzungsbedingungen<span class="also">Terms of Use</span></a></li>
    <li><a href="privacy.html">Datenschutzerklärung<span class="also">Privacy Policy</span></a></li>
    </ul>
    <p class="langs">Deutsch · English · Nederlands · Français · Español · Italiano</p>
  </div>
</body>
</html>
